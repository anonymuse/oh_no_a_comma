# .github/workflows/ci.yml
#
# CI pipeline for ats-location-canonicalization.
#
# Steps:
#   1. TypeScript type check (blocking)
#   2. Unit tests with coverage (blocking)
#   3. Fixture validation — duplicate canonical label check (blocking)
#   4. AI-assisted near-duplicate review (non-blocking, advisory only)
#
# Philosophy: deterministic checks gate the build; AI assists review.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: Typecheck + Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  fixture-validation:
    name: Fixture Validation
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate — no duplicate canonical labels
        run: npm run validate
        # This step fails the build if any fixture labels normalize to the same
        # canonical form (i.e. if a deduplication bug is reintroduced).

  ai-anomaly-review:
    name: AI Near-Duplicate Review (Advisory)
    runs-on: ubuntu-latest
    needs: fixture-validation
    # Non-blocking: continue even if this step fails
    continue-on-error: true
    # Only run when an API key is available (skip on forks / dependabot PRs)
    if: ${{ vars.ANTHROPIC_API_KEY != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run AI near-duplicate detector (advisory)
        run: npm run detect-dupes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Exit 0 is enforced in the script itself — this step is advisory only.
        # Failures here surface as warnings in the Actions summary, not build
        # failures.
